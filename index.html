<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Romance Factory</title>
<style>
body{font-family:Arial;background:#fff5f7;text-align:center;
padding:35px 18px;color:#49313b}
.card{background:white;padding:28px 20px;border-radius:20px;
max-width:400px;margin:auto}
a{display:block;background:#b83260;color:white;padding:16px;
border-radius:10px;text-decoration:none;margin-top:24px}
</style>
</head>
<body>
<div class="card">
<h1>Thank You! 🌹</h1>
<p>Thank you for choosing The Romance Factory.</p>
<p>We'd love to hear your honest feedback about your experience.</p>
<p id="count">Opening Google Reviews in 5 seconds...</p>
<a href="https://maps.app.goo.gl/VaN9nFL9LVVcpTxy5?g_st=ic">⭐ Leave a Google Review</a>
</div>
<script>
let seconds=5;
const timer=setInterval(()=>{
seconds--;
document.getElementById("count").textContent=
"Opening Google Reviews in "+seconds+" seconds...";
if(seconds<=0){
clearInterval(timer);
window.location.href="YOUR_GOOGLE_REVIEW_LINK";
}
},1000);
</script>
</body>
</html>
